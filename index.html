<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SnapLog Online</title>
<meta name="apple-mobile-web-app-title" content="SnapLog Online">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#dfe3ea;--brand:#1b3a8c;--ok:#1a8f4c;--warn:#c77700;--bad:#c62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:#1b3a8c;color:#fff;border-bottom:1px solid #12296a;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.proj{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.proj .n{font-weight:600;font-size:16px}
.proj .m{color:var(--mute);font-size:13px;margin-top:2px}
.proj .go{margin-left:auto;color:var(--mute);font-size:20px}
.bar{height:6px;background:#e8ebf0;border-radius:3px;overflow:hidden;margin-top:8px;width:100%}
.bar>i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.chips{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid-h,.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:0}
.grid-h{position:sticky;top:calc(49px + env(safe-area-inset-top));z-index:10;background:#e9ecf2;border:1px solid var(--line);border-radius:12px 12px 0 0;font-weight:600;font-size:13px;color:var(--mute)}
.grid-h>div{padding:8px 10px}
.row{background:var(--card);border:1px solid var(--line);border-top:0}
.row:last-child{border-radius:0 0 12px 12px}
.row>div{padding:8px;border-right:1px solid var(--line);min-width:0}
.row>div:last-child{border-right:0}
.num{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.row textarea{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;font:inherit;resize:none;background:#f7f8fa;color:var(--ink);overflow:hidden}
.row textarea:focus{outline:2px solid var(--brand);background:#fff}
.row textarea.nm{font-weight:600}
.row textarea.nt{font-size:13px;color:var(--mute);margin-top:4px}
.st{display:inline-block;font-size:11px;border-radius:10px;padding:1px 7px;margin-top:4px}
.st.w{background:#fff3e0;color:var(--warn)}.st.d{background:#e6f5ec;color:var(--ok)}.st.n{background:#eef0f4;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.add{display:flex;gap:5px;margin-top:6px}
.add label{flex:1;text-align:center;border:1px dashed #9aa3b5;border-radius:8px;padding:9px 4px;font-size:13px;color:var(--brand);cursor:pointer;background:#f0f3fb}
.add label.g{flex:0 0 38px;color:var(--mute)}
.add input{display:none}
.dt{font-size:11px;color:var(--mute);margin-top:4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.2);border-radius:28px;padding:12px 22px}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.88);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.modal.on{display:flex}
.modal img{max-width:100%;max-height:72vh;border-radius:8px}
.modal .cap{color:#fff;margin:10px 0;text-align:center;font-size:14px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#editor{padding:0;justify-content:flex-start;background:#0b0f18}
.etb{display:flex;flex-wrap:wrap;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 6px;justify-content:center;width:100%;align-items:center}
.etb .tool.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cdot{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0}.cdot.on{border-color:#fff}
.ewrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
#ecan{touch-action:none;background:#000;border-radius:6px}
.ebot{display:flex;gap:10px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));width:100%;justify-content:center}
.sheet{background:var(--card);border-radius:14px;padding:16px;width:min(420px,100%);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto}
.sheet .stick{position:sticky;bottom:-16px;background:var(--card);padding:10px 0 4px;margin-bottom:-4px;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 10px}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=password],.sheet input[type=date],.sheet input[type=datetime-local],.sheet select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}
.sheet .acts{margin-top:14px;justify-content:flex-end}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
#report{display:none}
.rp-item{break-inside:avoid;border:1px solid #ccc;border-radius:8px;padding:10px;margin-bottom:12px;background:#fff}
.rp-item h4{margin:0 0 6px}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-ex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}.rp-ex img{width:100%;border-radius:4px}
.one img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.xtra{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.rp-cols b{font-size:12px;color:#555;display:block;margin-bottom:4px}
.rp-cols img{width:100%;border-radius:4px;margin-bottom:4px;display:block}
.wrow{border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:8px;background:#fafbfd}
.wrow .r{display:grid;gap:4px;margin-bottom:4px}
.wrow .r1{grid-template-columns:1fr 2fr}
.wrow .r2{grid-template-columns:1.6fr .8fr .7fr 1fr auto}
.wrow input,.wrow select{width:100%;font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0}
.wcf-page{color:#000;font-size:12px}
.wcf-page,.wcf-page *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
.wcf-title{text-align:center;font-weight:bold;text-decoration:underline;font-size:13px;margin:2px 0 8px}
.wcf-hd{border-collapse:collapse;margin-bottom:6px}
.wcf-hd td{padding:0 4px;font-size:10px;line-height:1.3;border:0}
.wcf-hd td.wk{width:105px}
.wcf-tbl2{width:100%;border-collapse:collapse;font-size:10px}
.wcf-tbl2 th{background:#1c3d7a;color:#fff;padding:4px 3px;font-size:9.5px;border:1px solid #1c3d7a;font-weight:bold}
.wcf-tbl2 td{border:1px solid #000;padding:4px 3px;vertical-align:top;height:22px}
.wcf-tbl2 td.r{text-align:right}
.wcf-tbl2 td.c{text-align:center}
.wcf-stmt{border:1px solid #000;border-top:0;font-size:10px;padding:3px 5px}
.wcf-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px;font-size:11px}
.sigbox{height:46px;border-bottom:1px solid #999;margin:4px 0 6px}
.wcf-cert{font-size:11px;margin-top:18px}
.wcf-rembox{border:1px solid #000;width:56%;margin-top:14px}
.wcf-remh{text-align:center;font-weight:bold;border-bottom:1px solid #000;padding:3px;font-size:11px}
.wcf-remb{min-height:46px;padding:4px;font-size:11px}
.wrow .r3{grid-template-columns:1fr}
@page{size:A4;margin:0}
@media print{
  header.top,.fab,.noprint{display:none!important}
  body{background:#fff}main{padding:14mm;max-width:none}
  .rp-item{break-inside:auto}
  .rp-item h4,.rp-cols b{break-after:avoid}
  .rp-cols img,.rp-ex img{width:95%;margin:0 auto;display:block}
}
</style>
</head>
<body>
<header class="top">
  <button class="btn sm" id="back" style="display:none">‹ Back</button>
  <h1 id="title">SnapLog Online</h1>
  <button class="btn sm" id="menuBtn">⋯</button>
</header>
<main id="main"></main>
<button class="btn primary fab" id="fab">＋ New project</button>

<div id="busy" style="display:none;position:fixed;left:0;right:0;top:0;z-index:90;background:#12296a;color:#fff;padding:10px;text-align:center;font-size:14px"></div>

<div class="modal" id="login" style="background:var(--bg);z-index:80">
  <div class="sheet" style="box-shadow:0 4px 20px rgba(0,0,0,.1)">
    <h3 style="color:var(--brand)">SnapLog Online</h3>
    <label>Name</label><input type="text" id="lu" autocapitalize="none" autocorrect="off" autocomplete="username">
    <label>Password</label><input type="password" id="lp" autocomplete="current-password">
    <div id="lerr" style="color:var(--bad);font-size:13px;min-height:18px;margin-top:6px"></div>
    <button class="btn primary" id="lbtn" style="width:100%;margin-top:6px">Log in</button>
  </div>
</div>

<div class="modal" id="viewer">
  <img id="vimg" alt="">
  <div class="cap" id="vcap"></div>
  <div class="acts"><button class="btn" id="vmark">✏️ Mark up</button><button class="btn" id="vedit">Edit date/time</button><button class="btn danger" id="vdel">Delete photo</button><button class="btn" id="vclose">Close</button></div>
</div>

<div class="modal" id="menu">
  <div class="sheet">
    <h3>Options</h3>

      <option value="800">Small – 800 px (~60 KB)</option>

    <label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin-top:14px"><input type="checkbox" id="optStamp"> Show date &amp; time (photos, PDF report, Word)</label>
    <div class="acts" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">
      <button class="btn" id="fullbk" style="display:none">💾 Full backup (zip)</button>
      <button class="btn" id="logbtn" style="display:none">📜 Activity log</button>

      <label class="btn" style="margin:0;color:var(--ink)">⬆ Import / restore (.json)<input type="file" id="jsonin" accept=".json,application/json" style="display:none"></label>
      <button class="btn" id="logout">Log out</button>
    </div>
    <div class="acts" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"><button class="btn" id="chgpw">🔑 Change my password</button><button class="btn" id="refreshApp">⟳ Refresh app (get latest version)</button></div>
    <div class="dt" id="who" style="margin-top:10px"></div>
    <div class="dt" id="ver"></div>
    <div class="acts stick" style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" id="menuClose">Done</button></div>
  </div>
</div>

<div class="modal" id="wcfm">
  <div class="sheet">
    <h3>Work Completion Form (optional)</h3>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin-top:4px"><input type="checkbox" id="wcfOn" style="width:auto"> Use a WCF for this project</label>
    <label>Client / job</label><input type="text" id="wcfJob">
    <label>CBRE ref no.</label><input type="text" id="wcfRef">
    <label>PO no.</label><input type="text" id="wcfPo">
    <label>Requested by</label><input type="text" id="wcfReq">

    <label>Location</label><input type="text" id="wcfLoc">

    <div id="wcfLogoBox"></div>
    <input type="file" id="wcfLogoIn" accept="image/*" style="margin-top:6px">

  </div>
</div>

<div class="modal" id="editor">
  <div class="etb">
    <button class="btn sm tool on" data-tool="p">✏️ Draw</button>
    <button class="btn sm tool" data-tool="o">◯ Circle</button>
    <button class="btn sm tool" data-tool="a">➚ Arrow</button>
    <button class="btn sm tool" data-tool="t">T Text</button>
    <button class="btn sm tool" data-tool="m">☝ Move</button>
    <button class="cdot on" data-c="#ff3b30" style="background:#ff3b30" aria-label="Red"></button>
    <button class="cdot" data-c="#ffd60a" style="background:#ffd60a" aria-label="Yellow"></button>
    <button class="cdot" data-c="#ffffff" style="background:#ffffff" aria-label="White"></button>
    <button class="cdot" data-c="#0a84ff" style="background:#0a84ff" aria-label="Blue"></button>
    <button class="btn sm" id="edel">🗑 Delete</button>
    <button class="btn sm" id="eundo">↶ Undo</button>
    <button class="btn sm" id="eclear">Clear all</button>
  </div>
  <div class="ewrap"><canvas id="ecan"></canvas></div>
  <div class="ebot"><button class="btn" id="ecancel">Cancel</button><button class="btn primary" id="esave">Save</button></div>
</div>

<div class="modal" id="prompt">
  <div class="sheet">
    <h3 id="ptitle"></h3>
    <input type="text" id="pinput" autocomplete="off">
    <div class="acts" style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="pcancel">Cancel</button><button class="btn primary" id="pok">OK</button></div>
  </div>
</div>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString("en-SG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtD=t=>new Date(t).toLocaleDateString("en-SG",{day:"2-digit",month:"short"});
const cfg={size:+(localStorage.pl_size||1024),stamp:localStorage.pl_stamp!=="0",xlabel:localStorage.pl_xlabel||"Additional photos",bl:localStorage.pl_bl||"Before",al:localStorage.pl_al||"After"};
let reportT=Date.now();
const toLocalInput=t=>new Date(t-new Date(t).getTimezoneOffset()*60000).toISOString().slice(0,16);

/* ---------- Supabase ---------- */
const APP_VER="2026-11-17.10";
const SB_URL="https://bhhpyhocacoldqiaxdql.supabase.co";
const SB_KEY="sb_publishable_xem6cdCls26YXIsd_ITGlw_DyXCkKqW";
const BUCKET="photos",DOMAIN="@snaplog.app",DOMAINS=["@snaplog.app","@snaplog.online"];
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let me=null,isAdmin=false;
const J=r=>{if(r.error)throw r.error;return r.data};
function logAct(action,detail){try{Promise.resolve(sb.from("snaplog_log").insert({action,detail:detail||""})).catch(()=>{})}catch{}}
const iname=i=>(i&&i.name)||"(unnamed item)";
const kname=k=>k==="before"?cfg.bl:k==="after"?cfg.al:cfg.xlabel;
const who=()=>(me&&me.email||"").replace(/@snaplog\.(app|online)$/i,"");
function busy(m){const b=$("#busy");b.style.display=m?"block":"none";if(m)b.textContent=m}
window.addEventListener("unhandledrejection",e=>{busy(false);alert("Something went wrong: "+((e.reason&&e.reason.message)||e.reason))});
const safe=s=>String(s||"").replace(/[\\/:*?"<>|\u0000-\u001f]+/g,"").trim().slice(0,60)||"untitled";
function dl(blob,name){logAct("Downloaded file",name);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function signedUrls(paths){
  const uniq=[...new Set(paths.filter(Boolean))],m={};
  for(let k=0;k<uniq.length;k+=100){
    const r=J(await sb.storage.from(BUCKET).createSignedUrls(uniq.slice(k,k+100),3600));
    r.forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});
  }
  return m;
}
async function fetchItems(pid){
  const rows=J(await sb.from("snaplog_items").select("id,name,notes,position,wcf,snaplog_photos(id,kind,path,orig_path,marks,created_at)").eq("project_id",pid).order("position"));
  const urls=await signedUrls(rows.flatMap(r=>r.snaplog_photos.map(p=>p.path)));
  return rows.map(r=>{
    const it={id:r.id,position:r.position,name:r.name||"",notes:r.notes||"",wcf:r.wcf||null,before:[],after:[],extra:[]};
    r.snaplog_photos.slice().sort((a,b)=>a.created_at<b.created_at?-1:a.created_at>b.created_at?1:0).forEach(p=>{
      if(it[p.kind])it[p.kind].push({id:p.id,path:p.path,d:urls[p.path]||"",o:p.orig_path||undefined,m:p.marks||undefined,t:new Date(p.created_at).getTime()});
    });
    return it;
  });
}
const photoBytes=async path=>new Uint8Array(await J(await sb.storage.from(BUCKET).download(path)).arrayBuffer());
async function removeFiles(paths){const l=[...new Set(paths.filter(Boolean))];for(let k=0;k<l.length;k+=100)J(await sb.storage.from(BUCKET).remove(l.slice(k,k+100)))}
const pathsOf=its=>its.flatMap(i=>[...i.before,...i.after,...i.extra].flatMap(p=>[p.path,p.o]));

/* ---------- image compression ---------- */
function compress(file,label){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    let w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,cfg.size/Math.max(w,h));
    w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("Cannot encode image")),"image/jpeg",.6);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Cannot read image"))};
  img.src=url;});}

/* ---------- state ---------- */
let view="home",proj=null,items=[],filter="all",viewing=null,rates=[];

/* ---------- prompt dialog ---------- */
function ask(title,val="",type="text"){return new Promise(res=>{
  $("#ptitle").textContent=title;const i=$("#pinput");i.type=type;i.value=val;
  $("#prompt").classList.add("on");setTimeout(()=>i.focus(),50);
  const done=v=>{$("#prompt").classList.remove("on");$("#pok").onclick=$("#pcancel").onclick=i.onkeydown=null;res(v)};
  $("#pok").onclick=()=>done(i.value.trim()||null);
  $("#pcancel").onclick=()=>done(null);
  i.onkeydown=e=>{if(e.key==="Enter")done(i.value.trim()||null)};});}

/* ---------- HOME ---------- */
async function home(){
  view="home";proj=null;
  $("#back").style.display="none";$("#title").textContent="SnapLog Online";
  $("#fab").style.display="";$("#fab").textContent="＋ New project";
  busy("Loading…");
  const ps=J(await sb.from("snaplog_projects").select("id,name,created_at,snaplog_items(id,snaplog_photos(kind))").is("deleted_at",null).order("created_at",{ascending:false}));
  busy(false);
  let h="";
  if(!ps.length)h='<div class="empty">No projects yet.<br>Tap <b>＋ New project</b> to start.</div>';
  for(const p of ps){
    const li=p.snaplog_items,has=(i,k)=>i.snaplog_photos.some(x=>x.kind===k);

const todayISO=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Singapore"});
const money2=n=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function wcfDate(p){return (p&&p.wcf&&p.wcf.date)||todayISO()}
function rateFor(type,date){
  const r=rates.find(x=>x.work_type===type&&x.effective_from<=date);
  return r?+r.adj_pct:null;
}
function wcfCalc(w,date){
  const q=+w.qty||0,pr=+w.price||0,pct=rateFor(w.type,date);
  return{amt:q*pr,pct,tot:q*pr*(1+(pct||0)/100),missing:pct==null};
}
function wcfTypes(){return [...new Set(rates.map(r=>r.work_type))]}
function wcfLines(prj){
  const date=wcfDate(prj),src=(prj.wcf&&prj.wcf.lines)||[];

}
const wcfGrand=lines=>lines.reduce((a,l)=>a+l.tot,0);

/* ---------- photo mark-up (original is kept, marks are removable) ---------- */
let ed=null,edTool="p",edColor="#ff3b30";
function edDraw(ctx,w,h,shapes,img){
  ctx.drawImage(img,0,0,w,h);
  const lw=Math.max(2,w/130);
  ctx.lineCap="round";ctx.lineJoin="round";
  for(const s of shapes){
    ctx.lineWidth=lw;ctx.strokeStyle=s.c;ctx.fillStyle=s.c;
    if(s.t==="p"){ctx.beginPath();s.pts.forEach((q,j)=>j?ctx.lineTo(q[0]*w,q[1]*h):ctx.moveTo(q[0]*w,q[1]*h));ctx.stroke()}
    else if(s.t==="o"){ctx.beginPath();ctx.ellipse((s.x1+s.x2)/2*w,(s.y1+s.y2)/2*h,Math.max(1,Math.abs(s.x2-s.x1)/2*w),Math.max(1,Math.abs(s.y2-s.y1)/2*h),0,0,Math.PI*2);ctx.stroke()}
    else if(s.t==="a"){
      const x1=s.x1*w,y1=s.y1*h,x2=s.x2*w,y2=s.y2*h,a=Math.atan2(y2-y1,x2-x1),hl=lw*5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a-.45),y2-hl*Math.sin(a-.45));ctx.lineTo(x2-hl*Math.cos(a+.45),y2-hl*Math.sin(a+.45));ctx.closePath();ctx.fill();
    }else if(s.t==="t"){
      const fs=Math.max(14,w/20);ctx.font="bold "+fs+"px sans-serif";ctx.textBaseline="middle";
      ctx.lineWidth=fs/5;ctx.strokeStyle="rgba(0,0,0,.75)";ctx.strokeText(s.s,s.x*w,s.y*h);ctx.fillText(s.s,s.x*w,s.y*h);
    }
  }
}
function pushHist(){ed.hist.push(JSON.stringify(ed.shapes));if(ed.hist.length>50)ed.hist.shift()}
function shBox(s,c){
  const W=c.width,H=c.height;
  if(s.t==="p"){const xs=s.pts.map(q=>q[0]),ys=s.pts.map(q=>q[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
  if(s.t==="t"){const ctx=c.getContext("2d"),fs=Math.max(14,W/20);ctx.font="bold "+fs+"px sans-serif";const w=ctx.measureText(s.s).width/W;return[s.x,s.y-fs/2/H,s.x+w,s.y+fs/2/H]}
  return[Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.max(s.x1,s.x2),Math.max(s.y1,s.y2)];
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function edHit(q){
  const c=$("#ecan"),W=c.width,H=c.height,px=q[0]*W,py=q[1]*H,thr=24;
  for(let i=ed.shapes.length-1;i>=0;i--){

/* ---------- Full backup (admin): folder per project, photos + originals + Word report ---------- */
async function fullBackup(only){
  if(!confirm(only?"Download a backup of this project?":"Download a backup of ALL projects? This can take a few minutes – keep this page open."))return;
  const files=[],names=new Set();
  try{
    busy("Preparing…");
    await loadRates();
    const prs=only?[only]:J(await sb.from("snaplog_projects").select("id,name,wcf").is("deleted_at",null).order("created_at"));
    let pi=0;
    for(const pr of prs){
      pi++;
      let folder=safe(pr.name),c=2;
      while(names.has(folder.toLowerCase()))folder=safe(pr.name)+" ("+(c++)+")";
      names.add(folder.toLowerCase());
      const its=await fetchItems(pr.id);
      const total=its.reduce((a,i)=>a+i.before.length+i.after.length+i.extra.length,0);let done=0;
      for(const [n,i] of its.entries()){
        const base=String(n+1).padStart(2,"0")+" "+safe(i.name||"item");
        for(const [kind,label] of [["before",cfg.bl],["after",cfg.al],["extra",cfg.xlabel]]){
          for(const [k,p] of i[kind].entries()){
            const nm=`${base} - ${safe(label)}${kind==="extra"?" "+(k+1):""}.jpg`;
            files.push({name:`${folder}/${nm}`,data:await photoBytes(p.path)});
            if(p.o)files.push({name:`${folder}/originals/${nm}`,data:await photoBytes(p.o)});
            done++;busy(`Backup: project ${pi}/${prs.length} – photo ${done}/${total}`);
          }
        }
      }
      busy(`Backup: building report for project ${pi}/${prs.length}…`);
      files.push({name:`${folder}/${safe(pr.name)} - photo report.docx`,data:new Uint8Array(await (await buildDocx(pr,its)).arrayBuffer())});
    }
    busy("Creating zip…");
    dl(zip(files,"application/zip"),"SnapLog backup "+new Date().toISOString().slice(0,10)+".zip");
  }finally{busy(false)}
}

async function refreshApp(){
  try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch{}
  try{const rs=await navigator.serviceWorker?.getRegistrations?.();if(rs)for(const r of rs)await r.unregister()}catch{}
  const u=new URL(location.href);u.searchParams.set("v",Date.now());location.replace(u.toString());
}

/* ---------- JSON backup / import (same format as the phone version) ---------- */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
const dlb=async path=>J(await sb.storage.from(BUCKET).download(path));
async function exportJson(only){
  if(!isAdmin)return;
  if(!confirm(only?"Download this project as a .json data file?":"Download ALL projects as one .json data file? Large backups can take a few minutes."))return;
  try{
    busy("Preparing…");
    const prs=only?[only]:J(await sb.from("snaplog_projects").select("id,name,created_at,wcf").is("deleted_at",null).order("created_at"));
    const projects=prs.map(p=>({id:p.id,name:p.name,created:p.created_at?new Date(p.created_at).getTime():Date.now(),...(p.wcf?{wcf:p.wcf}:{})}));
    const parts=['{"v":1,"projects":'+JSON.stringify(projects)+',"items":['];
    let first=true,pi=0;
    for(const pr of prs){
      pi++;
      const its=await fetchItems(pr.id);
      for(const [idx,i] of its.entries()){
        busy(`Project ${pi}/${prs.length} – item ${idx+1}/${its.length}`);
        const conv=async p=>{const q={d:await blobToDataURL(await dlb(p.path)),t:p.t};if(p.o){q.o=await blobToDataURL(await dlb(p.o));q.m=p.m}return q};
        const o={id:i.id,projectId:pr.id,order:i.position,name:i.name,notes:i.notes,...(i.wcf?{wcf:i.wcf}:{}),before:[],after:[],extra:[]};
        for(const k of ["before","after","extra"])for(const p of i[k])o[k].push(await conv(p));
        parts.push((first?"":",")+JSON.stringify(o));first=false;
      }
    }
    parts.push("]}");
    dl(new Blob(parts,{type:"application/json"}),(only?safe(only.name)+" - ":"SnapLog data ")+new Date().toISOString().slice(0,10)+".json");
  }finally{busy(false)}
}
async function importJson(file){
  let d;
  try{d=JSON.parse(await file.text())}catch{alert("That file is not a valid SnapLog backup.");return}
  if(!d||!Array.isArray(d.projects)||!Array.isArray(d.items)){alert("That file is not a valid SnapLog backup.");return}
  const KINDS=["before","after","extra"];
  const nPh=d.items.reduce((a,i)=>a+KINDS.reduce((s,k)=>s+((i[k]||[]).length),0),0);
  if(!confirm(`Import ${d.projects.length} project(s), ${d.items.length} item(s) and ${nPh} photo(s)?\nThey will be added as NEW projects (nothing is overwritten).`))return;
  let done=0;
  const up=async(dataUrl,pth)=>J(await sb.storage.from(BUCKET).upload(pth,await (await fetch(dataUrl)).blob(),{contentType:"image/jpeg"}));
  try{
    for(const p of d.projects){
      busy("Importing "+(p.name||"project")+"…");
      const np=J(await sb.from("snaplog_projects").insert({name:p.name||"Imported project",created_at:new Date(p.created||Date.now()).toISOString(),...(p.wcf?{wcf:p.wcf}:{})}).select("id").single());
      const its=d.items.filter(i=>i.projectId===p.id).sort((a,b)=>(a.order||0)-(b.order||0));
      for(const [idx,i] of its.entries()){
        const ni=J(await sb.from("snaplog_items").insert({project_id:np.id,position:Date.now()+idx,name:i.name||"",notes:i.notes||"",...(i.wcf?{wcf:i.wcf}:{})}).select("id").single());
        for(const kind of KINDS){
          for(const q of (i[kind]||[])){
            if(!q||!q.d)continue;
            const id=uid(),path=`${np.id}/${ni.id}/${id}.jpg`;
            let orig=null;
            if(q.o){orig=`${np.id}/${ni.id}/${id}-o.jpg`;await up(q.o,orig)}
            await up(q.d,path);
            J(await sb.from("snaplog_photos").insert({id,item_id:ni.id,kind,path,orig_path:orig,marks:q.o&&q.m?q.m:null,created_at:new Date(q.t||Date.now()).toISOString()}));
            done++;busy(`Importing photo ${done}/${nPh}…`);
          }
        }
      }
    }
  }finally{busy(false)}
  logAct("Imported data",d.projects.length+" project(s), "+done+" photo(s)");
  alert("Import finished: "+done+" photo(s) added.");
  home();
}
async function trash(){
  if(!isAdmin)return;
  view="trash";$("#back").style.display="";$("#title").textContent="Trash";$("#fab").style.display="none";
  busy("Loading…");
  const ps=J(await sb.from("snaplog_projects").select("id,name,deleted_at").not("deleted_at","is",null).order("deleted_at",{ascending:false}));
  busy(false);
  let h='<div class="foot" style="margin:6px 0 12px">Deleted projects. Restore them, or delete forever to free storage.</div>';
  if(!ps.length)h+='<div class="empty">The Trash is empty.</div>';
  for(const p of ps)h+=`<div class="card" style="display:block"><div class="n">${esc(p.name)}</div><div class="m">Deleted ${new Date(p.deleted_at).toLocaleString()}</div>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm primary" data-r="${p.id}">Restore</button><button class="btn sm danger" data-x="${p.id}">Delete forever</button></div></div>`;
  $("#main").innerHTML=h;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{busy("Restoring…");try{J(await sb.from("snaplog_projects").update({deleted_at:null}).eq("id",b.dataset.r));logAct("Restored project",(ps.find(x=>x.id===b.dataset.r)||{}).name)}finally{busy(false)}trash()});
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    const p=ps.find(x=>x.id===b.dataset.x);
    if(!confirm('Permanently delete "'+p.name+'" and all its photos? This cannot be undone.'))return;
    busy("Deleting…");try{const its=await fetchItems(p.id);await removeFiles(pathsOf(its));J(await sb.from("snaplog_projects").delete().eq("id",p.id));logAct("Deleted project forever",p.name)}finally{busy(false)}trash()});
}
let logPerson="";
async function activity(){
  if(!isAdmin)return;
  view="log";$("#back").style.display="";$("#title").textContent="Activity log";$("#fab").style.display="none";
  busy("Loading…");
  let rows;try{rows=J(await sb.from("snaplog_log").select("at,who,action,detail").order("at",{ascending:false}).limit(300))}catch(e){busy(false);$("#main").innerHTML='<div class="empty">The activity log is not set up yet.<br>Run the log SQL in Supabase first.</div>';return}
  busy(false);
  const nm=w=>(w||"").replace(/@snaplog\.(app|online)$/i,"");
  const people=[...new Set(rows.map(r=>nm(r.who)))].sort();
  const shown=logPerson?rows.filter(r=>nm(r.who)===logPerson):rows;
  let h=`<div class="foot" style="margin:6px 0 10px">Latest 300 actions.</div><select id="logsel" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:10px"><option value="">Everyone</option>${people.map(x=>`<option${x===logPerson?" selected":""}>${esc(x)}</option>`).join("")}</select>`;
  if(!shown.length)h+='<div class="empty">No activity yet.</div>';
  for(const r of shown)h+=`<div class="card" style="display:block;padding:10px 12px"><div class="n" style="font-size:14px">${esc(r.action)}</div>${r.detail?`<div class="m">${esc(r.detail)}</div>`:""}<div class="m" style="margin-top:2px">${esc(nm(r.who))} · ${new Date(r.at).toLocaleString()}</div></div>`;
  $("#main").innerHTML=h;
  $("#logsel").onchange=e=>{logPerson=e.target.value;activity()};
}
$("#logbtn").onclick=()=>{$("#menu").classList.remove("on");logPerson="";activity()};
$("#trashbtn").onclick=()=>{$("#menu").classList.remove("on");trash()};
$("#jsonbk").onclick=()=>{$("#menu").classList.remove("on");exportJson()};

/* ---------- login + start ---------- */
function showLogin(){me=null;isAdmin=false;$("#login").classList.add("on");$("#main").innerHTML="";$("#fab").style.display="none";$("#back").style.display="none";$("#lp").value=""}
async function afterLogin(u){me=u;isAdmin=(u.email||"").toLowerCase()==="admin"+DOMAIN;$("#login").classList.remove("on");await Promise.all([loadRates(),loadLogo()]);await home()}
$("#lbtn").onclick=async()=>{
  const u=$("#lu").value.trim().toLowerCase().replace(/\s+/g,""),p=$("#lp").value;
  if(!u||!p)return;
  $("#lerr").textContent="";busy("Logging in…");
  let r;
  if(u.includes("@"))r=await sb.auth.signInWithPassword({email:u,password:p});
  else{for(const d of DOMAINS){r=await sb.auth.signInWithPassword({email:u+d,password:p});if(!r.error)break}}
  busy(false);
  const okLogin=!r.error;
  if(r.error){$("#lerr").textContent="Wrong name or password.";return}
  await afterLogin(r.data.user);
  if(okLogin)logAct("Logged in","");
};
$("#lp").onkeydown=e=>{if(e.key==="Enter")$("#lbtn").click()};
(async()=>{
  if(SB_KEY.startsWith("PASTE")){$("#login").classList.remove("on");$("#fab").style.display="none";$("#main").innerHTML='<div class="empty"><b>Setup needed</b><br>Paste your Supabase anon key into SB_KEY near the top of the script.</div>';return}
  const {data}=await sb.auth.getSession();
  if(data.session)await afterLogin(data.session.user);else showLogin();
  sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")showLogin()});
})();
